name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build
        run: wails build -platform windows/amd64 -trimpath -ldflags="-s -w"
      - name: Pack
        run: |
          cd build/bin
          zip -q ../../token-monitor-windows-amd64.zip token-monitor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-windows-amd64
          path: token-monitor-windows-amd64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
      - name: Build Apple Silicon (arm64)
        run: wails build -platform darwin/arm64 -trimpath -ldflags="-s -w" 2>&1 | tee /tmp/build-arm64.log
        shell: bash
      - name: Dump build log on failure
        if: failure()
        run: |
          git config user.name "debug-bot"
          git config user.email "debug@users.noreply.github.com"
          git checkout -q -b build-debug || git checkout -q build-debug
          cp /tmp/build-arm64.log . || true
          git add -f build-arm64.log 2>/dev/null || true
          git commit -qm "build log dump" || true
          git push -f origin build-debug || true
      - name: Pack arm64
        run: |
          cd build/bin
          zip -qry ../../token-monitor-macos-arm64.zip token-monitor.app
          rm -rf token-monitor.app
      - name: Build Intel (amd64)
        run: wails build -platform darwin/amd64 -trimpath -ldflags="-s -w"
      - name: Pack amd64
        run: |
          cd build/bin
          zip -qry ../../token-monitor-macos-amd64.zip token-monitor.app
      - uses: actions/upload-artifact@v4
        with:
          name: token-monitor-macos
          path: |
            token-monitor-macos-arm64.zip
            token-monitor-macos-amd64.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            token-monitor-windows-amd64.zip
            token-monitor-macos-arm64.zip
            token-monitor-macos-amd64.zip
